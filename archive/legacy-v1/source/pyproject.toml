[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-remixmate"
version = "0.1.0"
description = "Arrangement-level AI DJ mixer and remixing toolkit."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "AI RemixMate contributors" }
]
keywords = ["audio", "remix", "dj", "stem-separation", "gradio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "numpy>=1.24.0,<2.0.0",
  "scipy>=1.10.0",
  "librosa>=0.10.1",
  "soundfile>=0.12.1",
  "pydub>=0.25.1",
  "tqdm>=4.66.0",
  "requests>=2.31.0",
  "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
web = [
  "gradio>=4.0.0",
  "fastapi>=0.115.0",
  "pydantic>=2.0.0,<2.12.0",
]
separation = [
  "demucs>=4.0.0",
  "torch>=2.1.0",
]
lyrics = [
  "openai-whisper>=20231117",
  "SpeechRecognition>=3.10.0",
  "pocketsphinx>=5.0.0",
]
ingestion = [
  "yt-dlp>=2024.3.10",
]
analysis = [
  "sentence-transformers>=2.7.0",
]
data = [
  "pandas>=2.0.0,<2.4.0",
  "numexpr>=2.8.7",
  "bottleneck>=1.3.7",
]
dev = [
  "pytest>=7.4.0",
]
all = [
  "gradio>=4.0.0",
  "fastapi>=0.115.0",
  "pydantic>=2.0.0,<2.12.0",
  "demucs>=4.0.0",
  "torch>=2.1.0",
  "openai-whisper>=20231117",
  "SpeechRecognition>=3.10.0",
  "pocketsphinx>=5.0.0",
  "yt-dlp>=2024.3.10",
  "sentence-transformers>=2.7.0",
  "pandas>=2.0.0,<2.4.0",
  "numexpr>=2.8.7",
  "bottleneck>=1.3.7",
]

[project.urls]
Repository = "https://github.com/Chunduri-Aditya/ai-remixmate"
Issues = "https://github.com/Chunduri-Aditya/ai-remixmate/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
