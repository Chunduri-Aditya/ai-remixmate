[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remixmate"
version = "0.2.0"
description = "AI-powered music remix engine — download, separate, analyse and blend tracks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["music", "remix", "audio", "ai", "demucs", "librosa"]

dependencies = [
    "librosa>=0.11",
    "soundfile>=0.12",
    "demucs>=4.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "scikit-learn>=1.7",
    "numpy>=2.0",
    "scipy>=1.16",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "mutagen>=1.47",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.35",
    "python-multipart>=0.0.31",
    "PyJWT[crypto]>=2.13",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "tqdm>=4.67",
    "click>=8.3.3",
    "requests>=2.33",
    "tenacity>=9.0",
    "typing_extensions>=4.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.25",
    "black>=25.1",
    "ruff>=0.12",
    "mypy>=1.16",
    "pre-commit>=4.2",
]
# MusicGen / VampNet / DAC generative stack. Gated off by default in the hosted
# product (REMIXMATE_GENERATIVE_ENABLED); the /ai/* routes 503 without it.
# Usage: pip install -e ".[generative]"
generative = [
    "descript-audio-codec>=1.0.0",
    "transformers==4.53.3",
    "safetensors==0.5.3",
    "huggingface-hub==0.33.4",
]
# Genius lyric-adjacency scoring for /setlist/wordplay. Soft: scripts/core/wordplay.py
# degrades to score 0.0 when absent.
wordplay = [
    "lyricsgenius>=3.0.1",
    "nltk>=3.9",
]

[project.scripts]
# After `pip install -e .` these become shell commands
remixmate = "scripts.remixmate_cli:main"

[tool.setuptools.packages.find]
# Auto-discover all sub-packages under the project root
where = ["."]
include = ["scripts*"]

# ---------------------------------------------------------------------------
# Developer tooling
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
extend-exclude = [
    "archive",
    "ai_remixmate_feature_lab",
    "scripts/ui",
    "remix-env",
    ".venv",
    ".venv-old",
    ".venv-new",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle + pyflakes + isort
ignore = ["E501"]                # line length handled by black

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true    # many audio libs lack stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "e2e_test_suite.py"]
