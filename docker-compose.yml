version: "3.9"

# ─── AI RemixMate — Docker Compose ──────────────────────────────────────────
#
#   docker compose up          → API only
#
# The frontend (frontend/) is a separate static deploy (Cloudflare Pages in
# production — see app/DEPLOYMENT_PLAN.md Phase 7). The Streamlit UI in
# scripts/ui/ is not deployed. This compose file runs the API alone.
#
# Volume layout matches scripts/core/paths.py canonical paths:
#   library/  — operator-curated CC catalogue (read-only in production)
#   outputs/  — rendered mixes
#   data/     — SQLite DB, embeddings, audit log

services:
  api:
    build: .
    container_name: remixmate-api
    ports:
      - "8000:8000"
    volumes:
      - ./library:/app/library
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - REMIXMATE_API_HOST=0.0.0.0
      - REMIXMATE_API_PORT=8000
      - REMIXMATE_LOGGING_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
