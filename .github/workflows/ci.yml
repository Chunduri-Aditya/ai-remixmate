name: CI

on:
  pull_request:
  push:
    branches: [hosted-app, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install ruff
          pip install -r requirements.txt
          pip install -e .
      - name: Ruff (Phase 7/8 surface)
        run: >
          ruff check
          scripts/api/cors.py
          scripts/api/auth.py
          scripts/api/routers/legal.py
          scripts/api/routers/account.py
          scripts/api/routers/admin.py
          scripts/core/legal_store.py
          tests/test_legal_phase8.py
          tests/test_cors_origins.py
      - name: Pytest (safe subset)
        run: >
          python -m pytest -m "not dj_analysis and not integration"
          --ignore=tests/e2e_test_suite.py
          --ignore=tests/test_audio_source.py
          -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
