name: CI

on:
  pull_request:
  push:
    branches: [hosted-app, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The scan and end to end tests need ffmpeg; tests/conftest.py fails the
      # run when CI=true and ffmpeg is missing, so they never skip silently here.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: >
          python -m pytest -m "not dj_analysis"
          --ignore=tests/e2e_test_suite.py
          -q
      - name: Pytest (dj_analysis)
        run: python -m pytest -m dj_analysis -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx eslint . --max-warnings 0
      - run: npx vite build
